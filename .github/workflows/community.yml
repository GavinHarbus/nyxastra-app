name: Community templates

# Triggers only when community/** changes — keeps the App release pipeline
# quiet and lets contributors get fast feedback on template-only PRs.
on:
  pull_request:
    paths:
      - "community/**"
      - ".github/workflows/community.yml"
  push:
    branches: [main]
    paths:
      - "community/**"
      - ".github/workflows/community.yml"

# PRs from forks run as read-only by default; we only need write
# permission on the gh-pages deploy that runs after merge to main.
# The `lint` job below intentionally never asks for write — that
# means PRs from external forks can never touch repo state.
permissions:
  contents: read

concurrency:
  # Cancel a running workflow when a new commit arrives on the same PR.
  group: community-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint community templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: community/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r community/scripts/requirements.txt

      # `--check` is lint-only: validates schema (v2), the embedded
      # `community` block (author/license/category/...), scans the
      # prompt body for secrets, and decodes + sanity-checks each
      # embedded cover image.
      - name: Lint
        run: python3 community/scripts/build_community.py --check

      # On PRs, also produce dist/ in dry-run mode and upload covers
      # as an artifact so reviewers can preview the actual gallery
      # images without having to base64-decode the JSON diff in their
      # head. This is the single most useful affordance for review.
      - name: Build dist/ (preview)
        if: github.event_name == 'pull_request'
        run: python3 community/scripts/build_community.py --build

      - name: Upload cover preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cover-preview
          path: community/dist/covers/
          retention-days: 7

  publish:
    name: Build & publish dist/
    needs: lint
    # Only deploy on push to main. Fork PRs never reach this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the gh-pages branch.
      contents: write
      # Needed for the OIDC federated login to Azure (blob upload). No
      # long-lived storage keys are stored in the repo.
      id-token: write
    # The `secrets` context is NOT allowed inside step `if:` conditions
    # (GitHub rejects the workflow with "Unrecognized named-value:
    # 'secrets'"). So we surface the Blob origin as a job-level env var —
    # `env` IS allowed in `if:` — and gate the Azure steps on it. Empty
    # when the secret is unset (e.g. forks) => those steps skip and the
    # build falls back to relative same-origin URLs. Every step in the
    # job also inherits this env, which is how build_community.py picks
    # up NYX_BLOB_BASE_URL.
    env:
      NYX_BLOB_BASE_URL: ${{ secrets.NYX_BLOB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: community/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r community/scripts/requirements.txt

      # Setting NYX_BLOB_BASE_URL makes build_community.py emit ABSOLUTE
      # download/cover/thumbnail URLs (pointing at Azure Blob) inside
      # index.json. The heavy .nyxtemplate downloads + cover WebPs are
      # then uploaded to Blob below, so the marketing site's Azure Static
      # Web App only has to host the (small) index.json and stays under
      # its 250 MiB app-content cap. If the secret is unset, the build
      # falls back to relative URLs (same-origin) automatically. The env
      # value is inherited from the job-level `env` block above.
      - name: Build dist/
        run: python3 community/scripts/build_community.py --build

      # Authenticate to Azure via GitHub OIDC (no stored storage key).
      # Requires a federated credential on the app registration bound to
      # this repo, plus the three AZURE_* secrets. Skipped automatically
      # if the Blob origin isn't configured (e.g. a fork without secrets),
      # so the gh-pages deploy still works with relative same-origin URLs.
      - name: Azure login (OIDC)
        if: ${{ env.NYX_BLOB_BASE_URL != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Upload the heavy artifacts to Blob. --overwrite keeps re-runs
      # idempotent; content-type is set so browsers download/render them
      # correctly (WebP images render inline, .nyxtemplate downloads as
      # a file via the gallery's download attribute). Auth mode 'login'
      # uses the OIDC session above (needs 'Storage Blob Data Contributor'
      # on the container).
      - name: Upload template downloads to Azure Blob
        if: ${{ env.NYX_BLOB_BASE_URL != '' }}
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --destination "${{ secrets.AZURE_BLOB_CONTAINER }}" \
            --destination-path templates \
            --source community/dist/templates \
            --auth-mode login \
            --overwrite \
            --content-type "application/octet-stream"

      - name: Upload covers to Azure Blob
        if: ${{ env.NYX_BLOB_BASE_URL != '' }}
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --destination "${{ secrets.AZURE_BLOB_CONTAINER }}" \
            --destination-path covers \
            --source community/dist/covers \
            --auth-mode login \
            --overwrite \
            --content-type "image/webp"

      # Keep an artifact copy for 30 days so we can grab a specific build
      # from the Actions UI if we ever need to debug a regression. This
      # snapshot stays FULL (templates + covers) even when they're pruned
      # from gh-pages below, so a specific build's heavy files remain
      # recoverable (Blob is uploaded with --overwrite, i.e. not versioned).
      - name: Upload dist/ as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: community-dist
          path: community/dist/
          retention-days: 30

      # When the heavy artifacts were uploaded to Azure Blob above,
      # index.json already points at them by ABSOLUTE URL — so the copies
      # bundled in dist/ are dead weight on gh-pages. Drop them so gh-pages
      # only carries the small index.json (+ manifest.json), which is all
      # the gavinschneestudio sync needs. MUST stay gated on the Blob
      # origin: if it's unset (e.g. a fork), index.json still has RELATIVE
      # urls and gh-pages MUST keep hosting these files for the gallery to
      # resolve them.
      - name: Strip Blob-hosted artifacts from the gh-pages payload
        if: ${{ env.NYX_BLOB_BASE_URL != '' }}
        run: rm -rf community/dist/templates community/dist/covers

      # Publish to the gh-pages branch. When a Blob origin is configured
      # this now serves only index.json + manifest.json (the heavy
      # .nyxtemplate downloads + cover WebPs live on Azure Blob); without
      # one it still serves the full set. The gavinschneestudio sync reads
      # index.json from here.
      #
      # First-time setup (one-off, in repo Settings → Pages):
      #   Source: Deploy from a branch  ·  Branch: gh-pages  ·  Folder: / (root)
      - name: Add a no-Jekyll marker
        run: touch community/dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: community/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: "nyxastra-community-bot"
          user_email: "community-bot@gavinschneestudio.org"
          commit_message: "deploy: community/dist (${{ github.sha }})"

      # Notify the marketing site repo (gavinschneestudio) that the
      # community gallery has new artifacts to mirror. The marketing
      # site reverse-syncs from gh-pages into its own repo so the
      # production site (Azure SWA, accessible from China) can serve
      # the gallery same-origin instead of relying on github.io
      # (which is unreliable in China).
      #
      # The PAT only needs `Contents: Read and write` on the single
      # `gavinschneestudio` repo. If this step ever fails (token
      # rotated, repo renamed, etc.), the marketing site has its own
      # hourly schedule + manual button as fallbacks, so we don't
      # block the gh-pages deploy on it.
      - name: Notify marketing site to resync
        if: success()
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GAVINSCHNEESTUDIO_DISPATCH_TOKEN }}
          repository: GavinHarbus/gavinschneestudio
          event-type: community-updated
          client-payload: |
            {
              "source_sha": "${{ github.sha }}",
              "source_run_id": "${{ github.run_id }}"
            }
